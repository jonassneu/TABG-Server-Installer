[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "6.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/jonassneu/TABG-Server-Installer"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
